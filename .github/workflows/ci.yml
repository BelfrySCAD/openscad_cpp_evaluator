name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install bison/flex (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison flex

      - name: Install bison/flex (macOS)
        if: runner.os == 'macOS'
        # The hosted macOS runner image ships with an untrusted `aws/tap`
        # pre-tapped (unrelated to anything this workflow uses) -- any brew
        # command then prints a "taps are not trusted" warning for it.
        # Untap it first (non-fatal: `|| true` in case a future runner
        # image doesn't have it) rather than reaching for the deprecated
        # HOMEBREW_NO_REQUIRE_TAP_TRUST escape hatch.
        run: |
          brew untap aws/tap || true
          brew install bison flex

      - name: Install bison/flex (Windows)
        if: runner.os == 'Windows'
        # windows-latest ships MSYS2 pre-installed at C:\msys64 (not on
        # PATH). Its bison (3.8.2+) satisfies the submodule grammar's
        # %require "3.8" -- the Chocolatey winflexbison3 package is stuck
        # on bison 3.7.4 and fails that check. The submodule's own
        # CMakeLists.txt WIN32 block points BISON_EXECUTABLE/
        # FLEX_EXECUTABLE straight at the MSYS2 binaries.
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm bison flex"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # --config/-C Release: a no-op on the single-config generators
      # Linux/macOS use (CMAKE_BUILD_TYPE already picked the config), but
      # required on Windows's default multi-config Visual Studio
      # generator, which ignores CMAKE_BUILD_TYPE entirely.
      - name: Build
        run: cmake --build build --config Release -j

      # Bytecode VM on (the default as of the Phase 5 rollout decision --
      # see evaluator.hpp's own bytecodeVmEnabled() comment) and off
      # (OSCAD_BYTECODE_VM=0), so a regression in either the compiled or
      # the interpreted path fails CI, not just whichever happens to be
      # default at the time.

      # TEMPORARY DIAGNOSTIC (to be reverted): ubuntu-latest/windows-latest
      # both stall for 30+ min on TailCalls.InfiniteTailRecursion* (a
      # 1,000,000-iteration interpreter tail call whose trampoline
      # deliberately keeps one EvalContext alive per hop -- see
      # evalFunctionBodyTrampoline's own doc comment, user_calls.cpp -- so
      # this holds ~1M EvalContext objects simultaneously) while macOS
      # passes in seconds. Measuring peak RSS + wall time for just these
      # two tests, isolated, to confirm/refute memory pressure as the cause
      # before deciding on a real fix.
      - name: Report runner memory (Linux)
        if: runner.os == 'Linux'
        run: free -h

      - name: Report runner memory (Windows)
        if: runner.os == 'Windows'
        run: systeminfo | Select-String "Total Physical Memory","Available Physical Memory"

      - name: Report runner memory (macOS)
        if: runner.os == 'macOS'
        run: sysctl hw.memsize && vm_stat

      - name: Diagnose slow test memory (Linux)
        if: runner.os == 'Linux'
        run: |
          /usr/bin/time -v ./build/tests/oscad_eval_tests \
            --gtest_filter="TailCalls.InfiniteTailRecursionHitsTheIterationCapInsteadOfHanging:TailCalls.InfiniteTailRecursionErrorMentionsTheFunctionName"

      - name: Diagnose slow test memory (Windows)
        if: runner.os == 'Windows'
        run: |
          $exe = ".\build\tests\Release\oscad_eval_tests.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--gtest_filter=TailCalls.InfiniteTailRecursionHitsTheIterationCapInsteadOfHanging:TailCalls.InfiniteTailRecursionErrorMentionsTheFunctionName' -PassThru -NoNewWindow
          $peak = 0
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $p.HasExited) {
            $p.Refresh()
            if ($p.PeakWorkingSet64 -gt $peak) { $peak = $p.PeakWorkingSet64 }
            Start-Sleep -Milliseconds 500
          }
          $sw.Stop()
          Write-Host "Peak working set: $([math]::Round($peak / 1MB, 1)) MB"
          Write-Host "Wall time: $($sw.Elapsed)"
          Write-Host "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Diagnose slow test memory (macOS)
        if: runner.os == 'macOS'
        run: |
          /usr/bin/time -l ./build/tests/oscad_eval_tests \
            --gtest_filter="TailCalls.InfiniteTailRecursionHitsTheIterationCapInsteadOfHanging:TailCalls.InfiniteTailRecursionErrorMentionsTheFunctionName"

      - name: Test (bytecode VM on, the default)
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Test (bytecode VM off)
        run: ctest --test-dir build --output-on-failure -C Release
        env:
          OSCAD_BYTECODE_VM: "0"
